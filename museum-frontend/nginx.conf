# Configurazione di esempio per la PRODUZIONE (in sviluppo non serve).
# Va messa in /etc/nginx/conf.d/: lì i file sono letti dentro il blocco "http", dove vanno le zone di limite.
# Frontend e API sullo stesso dominio: il cookie SameSite=Strict funziona e il CORS non serve.
# Prima di usarla: dominio vero al posto di example.org, certificati (es. Let's Encrypt), app.cookie.secure=true nel backend.

# Primo filtro contro gli abusi, prima ancora del backend: al massimo 10 richieste al minuto per IP su login e
# registrazione (con una piccola coda per i doppi clic). Il backend ha comunque i suoi limiti.
limit_req_zone $binary_remote_addr zone=accesso:10m rate=10r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name example.org;

    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    root /usr/share/nginx/html;   # contenuto di museum-frontend/dist (npm run build)
    index index.html;

    client_max_body_size 1m;      # le API ricevono solo piccoli JSON

    # Intestazioni di sicurezza
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Login e registrazione: stesso inoltro delle altre API, più il limite per IP
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=accesso burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # si SOSTITUISCE l'intestazione invece di accodarla: un client non può far credere di avere un altro IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API: inoltro al backend Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # si SOSTITUISCE l'intestazione invece di accodarla: un client non può far credere di avere un altro IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JS e CSS della build hanno un nome che cambia a ogni versione: si possono tenere in cache a lungo
    # (niente add_header qui dentro: in nginx annullerebbe le intestazioni di sicurezza del blocco server)
    location /assets/ {
        expires 30d;
    }

    # Applicazione a pagina singola: ogni percorso torna a index.html
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name example.org;
    return 301 https://$host$request_uri;
}

# Il backend legge l'IP reale da X-Forwarded-For solo se la richiesta arriva da un proxy interno (127.0.0.1):
# senza questo, dietro nginx tutti i visitatori avrebbero lo stesso IP e i limiti per IP li bloccherebbero tutti insieme.
