spring:
  application:
    name: museum-booking-hub

  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:museum_booking_hub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Rome
    username: ${DB_USER:museum_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.museumhub.booking: DEBUG

app:
  admin:
    nome: ${ADMIN_NAME:Amministratore}
    email: ${ADMIN_EMAIL:admin@museumhub.it}
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  # difesa da forza bruta e abusi (valori per singolo IP, finestre in minuti)
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:30}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    register-max-per-ip: ${REGISTER_MAX_PER_IP:20}
    register-window-minutes: ${REGISTER_WINDOW_MINUTES:60}
